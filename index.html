<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="MGC・MNQ・MYMの1枚あたりのストップロス金額を計算">
  <title>Risk One</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">FUTURES RISK CALCULATOR</p>
        <h1>Risk One</h1>
      </div>
      <div class="status" id="offlineStatus" aria-live="polite">
        <span class="status-dot"></span>
        <span id="statusText">ONLINE</span>
      </div>
    </header>

    <section class="hero">
      <h2>Risk Calculator</h2>
    </section>

    <section class="calculator-card">
      <div class="field-group">
        <label>銘柄</label>
        <div class="symbol-tabs" role="radiogroup" aria-label="銘柄選択">
          <button class="symbol-tab active" type="button" data-symbol="MGC" role="radio" aria-checked="true">
            <strong>MGC</strong><span>Micro Gold</span>
          </button>
          <button class="symbol-tab" type="button" data-symbol="MNQ" role="radio" aria-checked="false">
            <strong>MNQ</strong><span>Micro Nasdaq</span>
          </button>
          <button class="symbol-tab" type="button" data-symbol="MYM" role="radio" aria-checked="false">
            <strong>MYM</strong><span>Micro Dow</span>
          </button>
        </div>
      </div>

      <div class="price-grid">
        <div class="field">
          <label for="entryPrice">Entry価格</label>
          <div class="input-wrap">
            <input id="entryPrice" inputmode="decimal" autocomplete="off" placeholder="例 3400.0">
            <button type="button" class="clear-btn" data-clear="entryPrice" aria-label="Entry価格を消去">×</button>
          </div>
        </div>

        <div class="field">
          <label for="slPrice">Stop Loss価格</label>
          <div class="input-wrap">
            <input id="slPrice" inputmode="decimal" autocomplete="off" placeholder="例 3395.0">
            <button type="button" class="clear-btn" data-clear="slPrice" aria-label="Stop Loss価格を消去">×</button>
          </div>
        </div>
      </div>

      <div class="result-panel" id="resultPanel">
        <div class="result-label">1 CONTRACT RISK</div>
        <div class="result-main">
          <span class="currency">$</span>
          <span id="riskValue">—</span>
        </div>
        <p id="resultHint">価格を入力すると自動で計算します</p>

        <div class="metrics">
          <div class="metric">
            <span>SL幅</span>
            <strong id="pointDistance">—</strong>
          </div>
          <div class="metric">
            <span>Ticks</span>
            <strong id="tickDistance">—</strong>
          </div>
          <div class="metric">
            <span>1 point</span>
            <strong id="pointValue">—</strong>
          </div>
        </div>
      </div>

      <button class="reset-button" id="resetButton" type="button">入力をリセット</button>
    </section>

    <section class="info-card">
      <div>
        <span class="info-symbol" id="infoSymbol">MGC</span>
        <p id="infoDescription">1 point = $10.00 / 1 tick = $1.00</p>
      </div>
      <span class="local-badge">LOCAL</span>
    </section>

    <footer>
      <p>手数料・スリッページは含みません。</p>
    </footer>
  </main>

  <script src="./app.js"></script>
</body>
</html>

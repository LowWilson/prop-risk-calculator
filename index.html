<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="MGC・MNQ・MYMのポイント幅からリスク、利益、RRを計算">
  <title>Risk One</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div><p class="eyebrow">FUTURES RISK CALCULATOR</p><h1>Risk One</h1></div>
    <div class="status" id="offlineStatus"><span class="dot"></span><span id="statusText">ONLINE</span></div>
  </header>



  <section class="card">
    <div class="input-panel">
    <label class="section-label">銘柄</label>
    <details class="market-settings">
      <summary>表示銘柄を選択</summary>
      <fieldset>
        <legend>表示する銘柄</legend>
        <label><input type="checkbox" data-market="MGC" checked> MGC · Micro Gold</label>
        <label><input type="checkbox" data-market="MNQ" checked> MNQ · Micro Nasdaq</label>
        <label><input type="checkbox" data-market="MYM" checked> MYM · US30 / Micro Dow</label>
      </fieldset>
      <p id="marketHint" role="status" aria-live="polite">最低1銘柄を選択してください。選択は自動保存されます。</p>
    </details>
    <div class="symbols">
      <button class="symbol active" data-symbol="MGC"><b>MGC</b><small>Micro Gold</small></button>
      <button class="symbol" data-symbol="MNQ"><b>MNQ</b><small>Micro Nasdaq</small></button>
      <button class="symbol" data-symbol="MYM"><b>MYM</b><small>US30 / Micro Dow</small></button>
    </div>

    <div class="grid points-grid">
      <label><span id="slLabel">損切り幅（pt）</span><input id="slPrice" inputmode="decimal"></label>
      <label><span id="tpLabel">利確幅（pt）</span><input id="tpPrice" inputmode="decimal"></label>
      <label>枚数<input id="contracts" inputmode="numeric" value="1"></label>
      <label>目標RR<input id="rrTarget" inputmode="decimal"></label>
    </div>

    </div>
    <div class="results-panel">
    <section class="risk result">
      <span class="result-label">TOTAL RISK</span>
      <div class="money">$<strong id="riskValue">—</strong></div>
      <p id="resultHint">損切り幅または利確幅（pt）を入力してください</p>
      <div class="metrics">
        <div><span>1枚の損失</span><b id="riskOne">—</b></div>
        <div><span>SL幅</span><b id="slDistance">—</b></div>
        <div><span>Ticks</span><b id="ticks">—</b></div>
      </div>
    </section>

    <section class="reward result">
      <div class="reward-head">
        <div><span class="result-label">TOTAL REWARD</span><strong id="rewardValue">$—</strong></div>
        <div class="rr"><span>RR</span><b id="actualRr">—</b></div>
      </div>
      <div class="metrics">
        <div><span>1枚の利益</span><b id="rewardOne">—</b></div>
        <div><span>TP幅</span><b id="tpDistance">—</b></div>
      </div>
    </section>

    </div>
    <button id="resetButton" class="reset">入力をリセット</button>
  </section>

  <section class="info">
    <b id="infoSymbol">MGC</b>
    <span id="infoDescription">1 point = $10.00 / 1 tick = $1.00</span>
    <em>LOCAL</em>
  </section>
</main>
<script src="./app.js"></script>
</body>
</html>
